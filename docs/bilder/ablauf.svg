<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #fcfcfb; stroke: #c9c8c2; stroke-width: 1.2; }
    .key { fill: #eaf1fb; stroke: #2a78d6; stroke-width: 1.4; }
    .t { fill: #0b0b0b; font-size: 14px; font-weight: 600; }
    .s { fill: #52514e; font-size: 11.5px; }
    .a { stroke: #7a7974; stroke-width: 1.4; fill: none; marker-end: url(#p); }
    .ok { fill: #0ca30c; } .wa { fill: #fab219; } .cr { fill: #d03b3b; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1a1a19; stroke: #3a3a37; }
      .key { fill: #16263b; stroke: #3987e5; }
      .t { fill: #ffffff; } .s { fill: #c3c2b7; } .a { stroke: #8f8e86; }
    }
  </style>
  <defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7a7974"/></marker></defs>

  <rect class="box" x="10" y="85" width="120" height="70" rx="8"/>
  <text class="t" x="70" y="114" text-anchor="middle">Mail</text>
  <text class="s" x="70" y="134" text-anchor="middle">Excel-Lagerstand</text>

  <rect class="box" x="160" y="85" width="120" height="70" rx="8"/>
  <text class="t" x="220" y="114" text-anchor="middle">Einlesen</text>
  <text class="s" x="220" y="134" text-anchor="middle">Struktur · Hersteller</text>

  <rect class="box" x="310" y="20" width="130" height="70" rx="8"/>
  <text class="t" x="375" y="49" text-anchor="middle">Abgleich</text>
  <text class="s" x="375" y="69" text-anchor="middle">mit letztem Stand</text>

  <rect class="box" x="310" y="150" width="130" height="70" rx="8"/>
  <text class="t" x="375" y="179" text-anchor="middle">Anreichern</text>
  <text class="s" x="375" y="199" text-anchor="middle">Herstellerseiten + Cache</text>

  <rect class="key" x="470" y="150" width="120" height="70" rx="8"/>
  <text class="t" x="530" y="179" text-anchor="middle">Bewertung</text>
  <text class="s" x="530" y="199" text-anchor="middle">Status + Grund</text>

  <rect class="box" x="640" y="20" width="230" height="56" rx="8"/>
  <text class="t" x="655" y="44">Auswertung + Dashboard</text>
  <text class="s" x="655" y="63">Abgänge · Verlauf · Ladenhüter</text>

  <rect class="box" x="640" y="96" width="230" height="56" rx="8"/>
  <circle class="ok" cx="660" cy="124" r="6"/>
  <text class="t" x="674" y="120">WooCommerce-Import</text>
  <text class="s" x="674" y="139">nur „sicher“</text>

  <rect class="box" x="640" y="172" width="230" height="56" rx="8"/>
  <circle class="wa" cx="656" cy="200" r="6"/><circle class="cr" cx="670" cy="200" r="6"/>
  <text class="t" x="684" y="196">Prüfliste</text>
  <text class="s" x="684" y="215">Korrekturen fließen zurück</text>

  <path class="a" d="M130,120 H156"/>
  <path class="a" d="M280,110 C295,110 295,55 306,55"/>
  <path class="a" d="M280,130 C295,130 295,185 306,185"/>
  <path class="a" d="M440,185 H466"/>
  <path class="a" d="M440,48 H636"/>
  <path class="a" d="M590,175 C615,175 615,124 636,124"/>
  <path class="a" d="M590,200 H636"/>
  <path class="a" d="M755,228 V242 H530 V224" stroke-dasharray="4 3"/>
</svg>
